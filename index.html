<style>
/* Layout: Handy zuerst. Kopfzeile mit Personenwahl, eine Ansicht, Navigationsleiste unten; Bearbeiten in Vollbild-Blättern */
:root{
  --bg:#eef3f3; --paper:#ffffff; --ink:#14292b; --muted:#56696b; --line:#d3dfdf;
  --accent:#0f6b6f; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --hl:#ffe27a; --hl-ink:#3a2c00;
  --warn:#a35a00; --warn-soft:#fdf0dc; --bad:#b3261e; --bad-soft:#fbe6e4; --ok:#2f7a3d; --ok-soft:#e4f3e6;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1415; --paper:#152122; --ink:#e3eeee; --muted:#93a8aa; --line:#2a3b3d;
  --accent:#5cc3c0; --accent-ink:#06201f; --accent-soft:#16383a;
  --hl:#6b5300; --hl-ink:#fff4cc;
  --warn:#f0b35c; --warn-soft:#3a2a12; --bad:#f2928a; --bad-soft:#3d1b19; --ok:#7fcf8c; --ok-soft:#173222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1415; --paper:#152122; --ink:#e3eeee; --muted:#93a8aa; --line:#2a3b3d;
  --accent:#5cc3c0; --accent-ink:#06201f; --accent-soft:#16383a;
  --hl:#6b5300; --hl-ink:#fff4cc;
  --warn:#f0b35c; --warn-soft:#3a2a12; --bad:#f2928a; --bad-soft:#3d1b19; --ok:#7fcf8c; --ok-soft:#173222; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.875rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top .app{font:700 .8rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.personbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.16);color:inherit;border:0;border-radius:10px;padding:8px 12px;font:700 1.05rem var(--f-display);cursor:pointer;text-align:left}
.personbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Ansichten */
main{padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px))}
.view .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.warn{border-color:var(--warn);background:linear-gradient(var(--warn-soft),var(--warn-soft)) top/100% 6px no-repeat,var(--paper)}
.card.go{border-color:var(--accent);background:linear-gradient(var(--accent),var(--accent)) top/100% 6px no-repeat,var(--paper)}
.card.ok{border-color:var(--ok);background:linear-gradient(var(--ok),var(--ok)) top/100% 6px no-repeat,var(--paper)}
.kicker{font:700 .74rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:700 2.2rem/1 var(--f-display)}
.rows{display:flex;flex-direction:column}
.rows>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rows>div:first-child{border-top:0}
.rows b{font-weight:700}
.rows .r{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Knöpfe & Felder */
.btn{font:700 1rem var(--f-body);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.sec{background:transparent;color:var(--accent)}
.btn.ghost{border-color:var(--line);background:var(--paper);color:var(--ink)}
.btn.danger{border-color:var(--bad);background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:8px 12px;font-size:.92rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns>.btn{flex:1 1 140px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:46px}
textarea{min-height:120px;resize:vertical}
textarea.mail{min-height:300px;font:.92rem/1.5 var(--f-mono)}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:1rem}
.chk input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.pill{display:inline-block;font:700 .78rem var(--f-body);padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.pend{background:var(--accent);color:var(--accent-ink)}
.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* Medikamenten-Karte */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:0;overflow:hidden;color:inherit;font:inherit;cursor:pointer}
.mcard.low{border-left:7px solid var(--warn)}
.mcard.out{border-left:7px solid var(--bad)}
.mname{display:block;background:var(--hl);color:var(--hl-ink);padding:10px 14px;font:700 1.12rem/1.25 var(--f-display);overflow-wrap:anywhere}
.mname small{display:block;font:500 .82rem var(--f-body);opacity:.85}
.mbody{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px}
.mfacts{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 150px}
.dgrid{display:grid;grid-template-columns:repeat(4,3em);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;font-variant-numeric:tabular-nums}
.dgrid span{display:block;padding:2px 0;font:500 .66rem var(--f-mono);color:var(--muted);background:var(--bg)}
.dgrid b{display:block;padding:3px 0;font:700 1.05rem var(--f-mono)}
.dgrid div+div{border-left:1px solid var(--line)}
.dgrid b.z{color:var(--muted);font-weight:400}
.dtext{font-weight:700}

/* Auswahl-/Abholzeilen */
.sel{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.sel.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sel .head{display:flex;flex-direction:row;text-align:left;align-items:center;gap:12px;padding:10px 14px;background:var(--hl);color:var(--hl-ink);cursor:pointer;font-size:1rem}
.sel .head input{width:28px;height:28px;min-height:0;flex:none;margin:0;accent-color:var(--accent)}
.sel .head .t{flex:1;min-width:0;font:700 1.08rem/1.25 var(--f-display);overflow-wrap:anywhere}
.sel .head .t small{display:block;font:500 .8rem var(--f-body);opacity:.85}
.sel .foot{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:10px 14px}
.sel.dis .head{opacity:.6;cursor:default}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--bg);color:var(--ink);font:700 1.3rem var(--f-body);cursor:pointer}
.stepper output{min-width:2.4em;text-align:center;font:700 1.05rem var(--f-mono)}
.num{width:6.5em}
.ist input{font-weight:700;border-color:var(--accent)}

/* Schritte */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps button{border:1.5px solid var(--line);background:var(--paper);color:var(--muted);border-radius:12px;padding:8px 4px;font:700 .86rem var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.steps button b{font:700 1.1rem var(--f-display)}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.stickybar{position:sticky;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom,0px));z-index:5}

/* Navigationsleiste */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.nav button{position:relative;border:0;background:none;color:var(--muted);font:700 .75rem var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{color:var(--accent)}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 .7rem/18px var(--f-body)}

/* Blatt (Vollbild-Dialog) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet-head{background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px calc(32px + env(safe-area-inset-bottom,0px))}

/* Hinweis unten */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));z-index:60;width:min(92vw,560px);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast span{flex:1}
.toast button{background:none;border:1.5px solid var(--paper);color:var(--paper);border-radius:8px;padding:6px 10px;font:700 .9rem var(--f-body);cursor:pointer}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .8rem var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 8px;cursor:pointer}
details.box{background:var(--paper);border:1px solid var(--line);border-radius:14px}
details.box>summary{cursor:pointer;list-style:none;padding:14px 16px;font:700 1.02rem var(--f-display);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"▾";color:var(--muted)}
details.box[open]>summary::after{content:"▴"}
details.box>.in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
input.filein{min-height:58px;padding:8px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);font-size:16px;cursor:pointer}
input.filein::file-selector-button{font:700 1rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;margin-right:10px;cursor:pointer}
.addr{font:500 .95rem var(--f-mono);user-select:all;overflow-wrap:anywhere}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="app">Medikamente</span>
    <button class="personbtn" id="personBtn" data-act="persons" aria-label="Person wechseln"><span id="personName"></span><span aria-hidden="true">▾</span></button>
  </div>
</header>

<main>
  <section class="view" id="v-home"><div class="wrap" id="homeBody"></div></section>
  <section class="view" id="v-meds" hidden><div class="wrap" id="medsBody"></div></section>

<nav class="nav" aria-label="Bereiche">

    <button role="tab" data-view="meds" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6.5" rx="3.25" transform="rotate(-35 12 12)"/><path d="M9.6 8.6l4.8 6.8"/></svg>Medikamente</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Rezepte<span class="badge" id="rxBadge" hidden></span></button>
    <button role="tab" data-view="more" aria-selected="false">

  </div>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><div class="wrap"><h2 id="sheetTitle"></h2><button class="btn ghost sm" data-act="sheet-close">Schließen</button></div></div>
  <div class="sheet-body"><div class="wrap" id="sheetBody"></div></div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button id="toastBtn" hidden></button></div>

<script>
(function(){
const FORMS={TABL:"Tabletten",FTBL:"Filmtabletten",KAPS:"Kapseln",HKAP:"Hartkapseln",WKAP:"Weichkapseln",TROP:"Tropfen",SALB:"Salbe",CREM:"Creme",GEL:"Gel",PULV:"Pulver",BTBL:"Brausetabletten",RETA:"Retardtabletten",RKAP:"Retardkapseln",MTAB:"magensaftres. Tabl.",SAFT:"Saft",SPRA:"Spray",PFLA:"Pflaster",INJ:"Injektionslösung",AUGT:"Augentropfen",DOSI:"Dosieraerosol",INHA:"Inhalation",ZTBL:"Zerfallstabletten"};
const SAMPLES=[
 {xml:`<MP v="026" U="BEISPIEL1" l="de-DE"><P g="Erika" f="Mustermann" b="19440312"/><A n="Beispielpraxis Dr. Muster" t="2026-09-30"/><S><M a="Ramipril 5 mg" f="TABL" m="1" d="0" v="0" h="0" r="Blutdruck"/><M a="Metformin 1000 mg" f="FTBL" m="1" d="0" v="1" h="0" i="zum Essen" r="Diabetes"/><M a="Simvastatin 20 mg" f="FTBL" m="0" d="0" v="1" h="0" r="Cholesterin"/><M a="ASS 100 mg" f="TABL" m="1" d="0" v="0" h="0"/><M a="Pantoprazol 20 mg" f="MTAB" m="1" d="0" v="0" h="0" i="30 Min. vor dem Frühstück"/></S><S c="418"><M a="Vitamin D3 1000 I.E." f="TABL" m="1" d="0" v="0" h="0"/></S></MP>`,stock:[42,9,61,20,3,80]},
 {xml:`<MP v="026" U="BEISPIEL2" l="de-DE"><P g="Max" f="Mustermann" b="19410705"/><A n="Beispielpraxis Dr. Muster" t="2026-08-14"/><S><M a="Bisoprolol 2,5 mg" f="TABL" m="1" d="0" v="0" h="0" r="Herz"/><M a="Apixaban 5 mg" f="FTBL" m="1" d="0" v="1" h="0" r="Blutverdünnung"/><M a="Torasemid 10 mg" f="TABL" m="1" d="0" v="0" h="0" r="Wassertabletten"/><M a="Tamsulosin 0,4 mg" f="RKAP" m="0" d="0" v="1" h="0"/></S></MP>`,stock:[55,12,30,8]}
];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
function num(v){if(v==null||v==="")return 0;v=String(v).replace(",",".").replace("½","0.5").replace("¼","0.25").replace("¾","0.75");const n=parseFloat(v);return isNaN(n)?0:n}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const today=()=>new Date().toLocaleDateString("de-DE");

function parseBMP(xml){
  const doc=new DOMParser().parseFromString(xml.trim(),"application/xml");
  if(doc.querySelector("parsererror"))throw new Error("Die Barcode-Daten sind kein gültiger Medikationsplan.");
  const mp=doc.querySelector("MP");if(!mp)throw new Error("Kein Medikationsplan in den Daten gefunden.");
  const Pt=mp.querySelector("P"),A=mp.querySelector("A");
  const patient=Pt?{name:[Pt.getAttribute("g"),Pt.getAttribute("f")].filter(Boolean).join(" "),geb:fmtDate(Pt.getAttribute("b")),praxis:A?.getAttribute("n")||"",praxisMail:A?.getAttribute("e")||"",praxisTel:A?.getAttribute("p")||"",praxisAddr:[A?.getAttribute("s"),[A?.getAttribute("z"),A?.getAttribute("c")].filter(Boolean).join(" ")].filter(Boolean).join(", "),kvnr:Pt.getAttribute("egk")||"",stand:fmtDate(A?.getAttribute("t"))}:null;
  const meds=[...mp.querySelectorAll("M")].map(m=>{
    const W=[...m.querySelectorAll("W")];
    const wirk=W.map(w=>[w.getAttribute("w"),w.getAttribute("s")].filter(Boolean).join(" ")).join(", ");
    const noName=!m.getAttribute("a")&&!wirk;const name=m.getAttribute("a")||wirk||("PZN "+(m.getAttribute("p")||"?"));
    return newMed({name,wirkstoff:m.getAttribute("a")?wirk:"",pzn:m.getAttribute("p")||"",form:FORMS[m.getAttribute("f")]||m.getAttribute("fd")||m.getAttribute("f")||"",
      m:num(m.getAttribute("m")),d:num(m.getAttribute("d")),v:num(m.getAttribute("v")),h:num(m.getAttribute("h")),
      frei:m.getAttribute("t")||"",hinweis:m.getAttribute("i")||"",grund:m.getAttribute("r")||"",noName,...freiInfo(m.getAttribute("t")||"",m)});
  });
  return {patient,meds};
}
function fmtDate(s){if(!s)return"";const m=/^(\d{4})-?(\d{2})-?(\d{2})/.exec(s);return m?`${m[3]}.${m[2]}.${m[1]}`:s}
const RHYTHM={d1:[1,"täglich"],d2:[1/2,"jeden 2. Tag"],w1:[1/7,"1× pro Woche"],w2:[2/7,"2× pro Woche"],w3:[3/7,"3× pro Woche"]};
const UNITS=["Stück","I.E.","ml","Hub","Tropfen","Beutel"];

function mergeMeds(old,neu){
  const used=new Set(),norm=s=>(s||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,"");
  neu.forEach(n=>{let o=old.find(x=>!used.has(x.id)&&x.pzn&&n.pzn&&pzn8(x.pzn)===pzn8(n.pzn));
    if(!o)o=old.find(x=>!used.has(x.id)&&norm(x.name)&&norm(x.name)===norm(n.name));
    if(!o)o=old.find(x=>!used.has(x.id)&&!n.noName&&x.name&&n.name&&norm(x.name.split(" ")[0])===norm(n.name.split(" ")[0]));
    if(o){used.add(o.id);["bestand","packung","menge","pending","lastOrder","lastPickup","stockDate","order"].forEach(k=>{if(o[k]!=null&&o[k]!=="")n[k]=o[k]});
      if(n.noName&&!o.noName){n.name=o.name;n.noName=false;n.form=n.form||o.form}}});
  return {meds:neu,removed:old.filter(x=>!used.has(x.id))}}

  if(pn){const match=S.persons.find(x=>x.name.toLowerCase()===pn.toLowerCase()||x.patient?.name?.toLowerCase()===pn.toLowerCase());
    if(match)p=match;else if(p.meds.length&&p.patient&&p.patient.name!==pn){p=newPerson(pn);S.persons.push(p)}else if(/^Person \d+$|^Neue Person$/.test(p.name))p.name=pn}
  const r=mergeMeds(p.meds,plan.meds);p.meds=r.meds;p.patient=plan.patient||p.patient;p.suggest=plan.suggest||[];
  if(plan.patient?.praxis){const d=findOrCreateDoc({name:plan.patient.praxis,email:plan.patient.praxisMail,phone:plan.patient.praxisTel,addr:plan.patient.praxisAddr});if(!p.order.docId)p.order.docId=d.id}
  if(plan.patient?.kvnr&&!p.order.oKvnr)p.order.oKvnr=plan.patient.kvnr;
  S.current=p.id;save();
  const st=$("impStatus");importNote={msg:(st&&st.textContent?st.textContent:`${p.meds.length} Medikamente übernommen.`)+(r.removed.length?` Nicht mehr im Plan und entfernt: ${r.removed.map(x=>x.name).join(", ")}.`:""),cls:st&&/warn|err/.test(st.className)?"warn":"ok"};

function pickInput(e){const f=e.target.dataset.pkf,row=e.target.closest("[data-pk]");if(!f||!row)return;const id=row.dataset.pk,d=pk[id],m=P().meds.find(x=>x.id===id);if(!d||!m)return;

/* Mail verschicken: Kopieren in drei Teilen + Gmail-Entwurf (mailto: wird in der Online-Ansicht blockiert) */
function splitMail(t){t=t||"";const m=/^\s*Betreff:\s*(.*)\n/.exec(t);return m?{subj:m[1].trim(),body:t.slice(m[0].length).replace(/^\s*\n/,"")}:{subj:"",body:t}}
function gmailUrl(to,t){const x=splitMail(t);return "https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to||"")+"&su="+encodeURIComponent(x.subj)+"&body="+encodeURIComponent(x.body)}
function sendBox(src,to){return `<div class="card"><div class="kicker">Mail verschicken</div>
  <button class="btn" data-act="draft" data-src="${src}" data-to="${esc(to||"")}">Als Mail-Entwurf öffnen</button>

  <div class="rows">
    <div><span><b>1 · An</b><br><span class="addr">${to?esc(to):"(keine E-Mail hinterlegt)"}</span></span><button class="btn ghost sm" data-act="cp" data-src="${src}" data-part="to" data-to="${esc(to||"")}" ${to?"":"disabled"}>Kopieren</button></div>
    <div><span><b>2 · Betreff</b><br><span class="small" id="${src}_subj">${esc(splitMail($(src)?.value??"").subj)}</span></span><button class="btn ghost sm" data-act="cp" data-src="${src}" data-part="subj">Kopieren</button></div>
    <div><span><b>3 · Nachricht</b></span><button class="btn ghost sm" data-act="cp" data-src="${src}" data-part="body">Kopieren</button></div>
  </div>
  <a class="btn sec" id="${src}_gm" href="#" target="_blank" rel="noopener">Mit Gmail öffnen</a>
  <p class="small muted">„Mit Gmail öffnen“ füllt alles automatisch aus, wenn du Gmail nutzt.</p></div>`}
function updSend(src,to){const v=$(src)?.value||"",s2=$(src+"_subj"),g=$(src+"_gm");if(s2)s2.textContent=splitMail(v).subj;if(g)g.href=gmailUrl(to,v)}
function docOptions(sel){return `<option value="">– bitte wählen –</option>`+S.docs.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("")+`<option value="__new">+ Neuen Arzt anlegen …</option>`}

  if(rxStep===3&&e.target.type==="checkbox")pickInput(e)});
$("rxBody").addEventListener("input",e=>{if(rxStep===3)pickInput(e)});

/* ===== Plan an Arzt senden ===== */
let planMsg=null,planDoc=null;
function shPlan(){const p=P();$("sheetTitle").textContent="Plan an Arzt senden";
  const doc=S.docs.find(d=>d.id===(planDoc||p.order.docId))||null;
  if(planMsg==null)planMsg=fillTpl(S.tplPlan||TPL_PLAN,{Patient:whoName(p),Geburtsdatum:p.patient?.geb||"",Versichertennummer:(p.order.oKvnr||"").trim(),Praxis:doc?.name||"",Medikationsplan:planLines(p),Absender:S.me.oName||"",Telefon:S.me.oPhone||"",Datum:today()});
  $("sheetBody").innerHTML=`<p class="muted">Für Facharzt, Klinik oder Vertretung: alle Medikamente mit aktueller Dosierung.</p>
  <div class="card"><label for="plDoc">An Arzt / Praxis<select id="plDoc">${docOptions(doc?.id)}</select></label>
  ${doc?.email?`<p class="small">E-Mail: <span class="addr">${esc(doc.email)}</span></p>`:doc?`<p class="note warn">Keine E-Mail hinterlegt. <button class="btn ghost sm" data-act="doc-edit" data-id="${doc.id}">E-Mail eintragen</button></p>`:""}</div>
  <div class="card"><label for="plText">Nachricht, direkt änderbar<textarea class="mail" id="plText">${esc(planMsg)}</textarea></label>
  </div>${sendBox("plText",doc?.email)}`;
  $("plText").oninput=e=>{planMsg=e.target.value;updSend("plText",S.docs.find(d=>d.id===(planDoc||P().order.docId))?.email)};
  updSend("plText",doc?.email);
  $("plDoc").onchange=e=>{if(e.target.value==="__new"){const d=findOrCreateDoc({name:"Neue Praxis "+(S.docs.length+1)});planDoc=d.id;save();openSheet("doc",d.id);return}planDoc=e.target.value||null;planMsg=null;shPlan()}}

/* ===== Personen ===== */
function shPersons(){$("sheetTitle").textContent="Person wählen";
  $("sheetBody").innerHTML=`<div class="mlist">${S.persons.map(p=>{const l=p.meds.filter(m=>!m.pending&&isLow(m)).length,pe=p.meds.filter(m=>m.pending).length;
    return `<button class="mcard" data-act="person-pick" data-id="${p.id}" ${p.id===S.current?'style="border-color:var(--accent)"':""}><span class="mname">${esc(p.name)}<small>${p.meds.length} Medikamente${l?` · ${l} knapp`:""}${pe?` · ${pe} angefordert`:""}</small></span></button>`}).join("")}</div>
  <button class="btn ghost block" data-act="person-add">+ Person hinzufügen</button>
  <button class="btn sec block" data-act="goto-more">Personen verwalten</button>`}

/* ===== Arzt bearbeiten (Blatt) ===== */
function shDoc(id){const d=S.docs.find(x=>x.id===id);if(!d){closeSheet();return}$("sheetTitle").textContent="Arzt / Praxis";
  $("sheetBody").innerHTML=`<div class="card">${docFields(d)}</div><button class="btn block" data-act="doc-done">Fertig</button>`;
  setTimeout(()=>{const n=$("df_name_"+d.id);if(n&&/^Neue Praxis/.test(d.name)){n.focus();n.select()}},50)}
function docFields(d){return `<label for="df_name_${d.id}">Name<input id="df_name_${d.id}" data-doc="${d.id}" data-df="name" value="${esc(d.name)}"></label>
  <label for="df_email_${d.id}">E-Mail<input id="df_email_${d.id}" type="email" data-doc="${d.id}" data-df="email" value="${esc(d.email)}"></label>
  <div class="grid2"><label for="df_phone_${d.id}">Telefon<input id="df_phone_${d.id}" type="tel" data-doc="${d.id}" data-df="phone" value="${esc(d.phone)}"></label>
  <label for="df_addr_${d.id}">Adresse<input id="df_addr_${d.id}" data-doc="${d.id}" data-df="addr" value="${esc(d.addr)}"></label></div>`}
document.addEventListener("input",e=>{const id=e.target.dataset.doc;if(!id)return;const d=S.docs.find(x=>x.id===id);if(d){d[e.target.dataset.df]=e.target.value;save()}});

/* ===== Mehr ===== */
let delId=null,delDocId=null,undo=null,openMore=new Set(["persons"]);
function renderMore(){const el=$("moreBody");
  const sec=(id,title,body)=>`<details class="box" data-sec="${id}" ${openMore.has(id)?"open":""}><summary>${title}</summary><div class="in">${body}</div></details>`;
  const persons=S.persons.map(p=>{const d=docOf(p),solo=d&&!S.persons.some(x=>x.id!==p.id&&x.order?.docId===d.id);
    return `<div class="card" style="padding:12px">
    <label for="pn_${p.id}">Name<input id="pn_${p.id}" data-pname="${p.id}" value="${esc(p.name)}"></label>
    <label for="pd_${p.id}">Arzt für Rezepte<select id="pd_${p.id}" data-pdoc="${p.id}">${docOptions(p.order?.docId)}</select></label>
    ${delId===p.id?`<div class="confirm"><b>${esc(p.name)} entfernen?</b><span class="small">Gelöscht werden ${p.meds.length} Medikamente mit Vorrat und Anforderungen sowie Versichertennummer und alle Angaben zu dieser Person.</span>
      ${solo?`<label class="chk small" for="delDoc" style="color:inherit"><input type="checkbox" id="delDoc" checked> Auch ${esc(d.name)} entfernen (nutzt sonst niemand)</label>`:""}
      <div class="btns"><button class="btn danger" data-act="p-del-yes">Ja, entfernen</button><button class="btn ghost" data-act="p-del-no">Abbrechen</button></div></div>`
    :`<button class="btn ghost sm" data-act="p-del" data-id="${p.id}" style="color:var(--bad);align-self:flex-start">Person entfernen</button>`}</div>`}).join("");
  const docs=S.docs.map(d=>{const users=S.persons.filter(p=>p.order?.docId===d.id).map(p=>p.name);
    return `<div class="card" style="padding:12px">${docFields(d)}<p class="small muted">${users.length?"Für: "+users.map(esc).join(", "):"Keiner Person zugeordnet"}</p>
    ${delDocId===d.id?`<div class="confirm"><b>${esc(d.name)} entfernen?</b><div class="btns"><button class="btn danger" data-act="d-del-yes" data-id="${d.id}">Ja, entfernen</button><button class="btn ghost" data-act="d-del-no">Abbrechen</button></div></div>`
    :`<button class="btn ghost sm" data-act="d-del" data-id="${d.id}" style="color:var(--bad);align-self:flex-start">Arzt entfernen</button>`}</div>`}).join("")||'<p class="muted">Noch kein Arzt. Beim Einlesen eines Plans wird die Praxis automatisch angelegt.</p>';
  const tpl=(key,def,keys,label)=>`<label for="tpl_${key}">${label}<textarea class="mail" id="tpl_${key}" data-tpl="${key}">${esc(S[key]||def)}</textarea></label>
    <div class="chips">${keys.map(k=>`<button class="chip" data-ph="%${k}%" data-for="tpl_${key}">%${k}%</button>`).join("")}</div>
    <button class="btn ghost sm" data-act="tpl-reset" data-key="${key}" style="align-self:flex-start">Standard wiederherstellen</button>`;
  el.innerHTML=`<div class="vhead"><h2>Mehr</h2></div>
  ${sec("persons","Personen",persons+`<button class="btn ghost" data-act="person-add">+ Person hinzufügen</button>`)}
  ${sec("docs","Ärzte und Praxen",docs+`<button class="btn ghost" data-act="doc-add">+ Arzt hinzufügen</button>`)}
  ${sec("me","Meine Daten",`<p class="small muted">Absender in allen Mails.</p><label for="meName">Name<input id="meName" data-me="oName" value="${esc(S.me.oName||"")}" autocomplete="name"></label>
    <label for="mePhone">Telefon<input id="mePhone" data-me="oPhone" type="tel" value="${esc(S.me.oPhone||"")}" autocomplete="tel"></label>
    <label for="meThr">Als knapp melden, wenn Vorrat kürzer reicht als (Tage)<input id="meThr" data-thr="1" inputmode="numeric" value="${S.threshold}"></label>`)}
  ${sec("tpl","Mail-Vorlagen",`<p class="small muted">Platzhalter antippen fügt sie an der Schreibmarke ein. Leere Angaben fallen automatisch weg.</p>
    ${tpl("tplDoc",TPL_DOC,["Patient","Geburtsdatum","Versichertennummer","Praxis","Medikamente","Absender","Telefon","Datum"],"Rezept anfordern")}
    ${tpl("tplPlan",TPL_PLAN,TPL_PLAN_KEYS,"Plan an Arzt senden")}`)}
  ${sec("backup","Datensicherung &amp; anderes Gerät",`<p class="small muted">Die Daten liegen nur in diesem Browser. Sicherung mit Passwort erstellen, als Text an dich schicken, auf dem anderen Gerät einlesen. Auch sinnvoll, bevor Browserdaten gelöscht werden.</p>
    <label for="bkPass">Passwort (mind. 6 Zeichen)<input id="bkPass" type="password" autocomplete="new-password"></label>
    <button class="btn" data-act="bk-make">Sicherung als Text kopieren</button><textarea id="bkOut" readonly hidden style="min-height:80px;font:.8rem var(--f-mono)"></textarea>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="kicker">Sicherung einlesen</div>
    ${wvHint()}<label for="rsFile">Sicherungsdatei<input id="rsFile" type="file" class="filein"></label>
    <p class="small muted" id="rsFileName">Datei aus Downloads, Mail-Anhang oder Dateien-App.</p>
    <label for="rsText">oder Text einfügen<textarea id="rsText" placeholder="MEDPLAN1:…" style="min-height:80px"></textarea></label>
    <label for="rsPass">Passwort<input id="rsPass" type="password" autocomplete="off"></label>
    <button class="btn" data-act="rs-check">Sicherung einlesen</button><div id="rsConfirm"></div>`)}
  <p class="small muted" style="text-align:center">Alle Daten bleiben auf diesem Gerät.</p>`;
  $("rsFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    let t="";try{t=(await f.text()).trim()}catch(err){}
    if(!/^MEDPLAN1:/.test(t.replace(/\s+/g,""))){$("rsFileName").textContent=`„${f.name}“ ist keine Sicherung dieser App. Eine Sicherung beginnt mit „MEDPLAN1:“.`;$("rsFileName").className="note err";return}
    $("rsText").value=t;$("rsFileName").textContent=`Geladen: ${f.name}. Jetzt Passwort eingeben und „Sicherung einlesen“ tippen.`;$("rsFileName").className="note ok";$("rsPass").focus()};
}
$("moreBody").addEventListener("toggle",e=>{const s=e.target.dataset?.sec;if(s){e.target.open?openMore.add(s):openMore.delete(s)}},true);
$("moreBody").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.pname){const p=S.persons.find(x=>x.id===t.dataset.pname);p.name=t.value.trim()||"Ohne Namen";save();render()}
  if(t.dataset.pdoc){const p=S.persons.find(x=>x.id===t.dataset.pdoc);if(t.value==="__new"){const d=findOrCreateDoc({name:"Neue Praxis "+(S.docs.length+1)});p.order.docId=d.id;save();openSheet("doc",d.id);return}p.order.docId=t.value||undefined;save();render()}
  if(t.dataset.me){S.me[t.dataset.me]=t.value.trim();save()}
  if(t.dataset.thr){S.threshold=Math.max(1,Math.round(num(t.value)))||14;save();render()}
  if(t.dataset.df==="name")render()});
$("moreBody").addEventListener("input",e=>{const k=e.target.dataset.tpl;if(k){S[k]=e.target.value===({tplDoc:TPL_DOC,tplPlan:TPL_PLAN})[k]?undefined:e.target.value;save()}});

/* ===== Person entfernen (mit Rückgängig) ===== */
let blobUrls=[];
function purgeTransient(){rxMsg=null;planMsg=null;planDoc=null;rxNote="";importNote=null;medDel=false;Object.keys(pk).forEach(k=>delete pk[k]);
  blobUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});blobUrls=[];
  if(ocrWorker){try{ocrWorker.terminate()}catch(e){}ocrWorker=null}
  if(!$("sheet").hidden)closeSheet()}
function delPerson(){const idx=S.persons.findIndex(p=>p.id===delId);if(idx<0)return;
  const wantDoc=$("delDoc")?.checked;const [gone]=S.persons.splice(idx,1);
  const keep=new Set(S.persons.flatMap(p=>p.meds.map(m=>pzn8(m.pzn))));const pznGone={};
  gone.meds.forEach(m=>{if(m.pzn&&S.pzn[m.pzn]&&!keep.has(pzn8(m.pzn))){pznGone[m.pzn]=S.pzn[m.pzn];delete S.pzn[m.pzn]}});
  let docGone=null;const gd=S.docs.find(x=>x.id===gone.order?.docId);
  if(gd&&wantDoc&&!S.persons.some(x=>x.order?.docId===gd.id)){docGone={doc:gd,idx:S.docs.indexOf(gd)};S.docs=S.docs.filter(x=>x!==gd)}
  if(!S.persons.length)S.persons.push(newPerson("Person 1"));
  if(!S.persons.find(p=>p.id===S.current))S.current=S.persons[Math.min(idx,S.persons.length-1)].id;
  undo={person:gone,idx,pzn:pznGone,doc:docGone};delId=null;purgeTransient();save();render();
  setTimeout(()=>{undo=null},15000);toast(`${gone.name} wurde entfernt.`,"Rückgängig",()=>{
    if(!undo)return;if(S.persons.length===1&&!S.persons[0].meds.length&&/^Person \d+$/.test(S.persons[0].name))S.persons=[];
    S.persons.splice(Math.min(undo.idx,S.persons.length),0,undo.person);S.current=undo.person.id;Object.assign(S.pzn,undo.pzn);
    if(undo.doc&&!S.docs.some(x=>x.id===undo.doc.doc.id))S.docs.splice(Math.min(undo.doc.idx,S.docs.length),0,undo.doc.doc);
    undo=null;save();render();toast("Wiederhergestellt.")},15000);}

/* ===== Aktionen (Klicks) ===== */
document.addEventListener("click",async e=>{
  const ph=e.target.closest("[data-ph]");if(ph){const t=$(ph.dataset.for),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;t.value=t.value.slice(0,a)+ph.dataset.ph+t.value.slice(b);t.focus();t.setSelectionRange(a+ph.dataset.ph.length,a+ph.dataset.ph.length);t.dispatchEvent(new Event("input",{bubbles:true}));return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,p=P();
  switch(a){
    case "sheet-close":closeSheet();break;
    case "copy-url":copyText(APP_URL,b);break;
    case "persons":openSheet("persons");break;
    case "person-pick":S.current=id;rxMsg=null;planMsg=null;planDoc=null;rxNote="";importNote=null;Object.keys(pk).forEach(k=>delete pk[k]);save();closeSheet();if(view==="rx")rxEnter();render();break;
    case "person-add":{const np=newPerson("Person "+(S.persons.length+1));S.persons.push(np);S.current=np.id;save();if(!$("sheet").hidden)closeSheet();openMore.add("persons");go("more");setTimeout(()=>{const i=$("pn_"+np.id);if(i){i.focus();i.select()}},50);break}
    case "goto-more":closeSheet();openMore.add("persons");go("more");break;
    case "import":openSheet("import");break;
    case "imp-text":try{applyPlan(parseText($("impText").value))}catch(err){setStatus(err.message,"err")}break;
    case "sample":SAMPLES.forEach((s,i)=>{const pl=parseBMP(s.xml);pl.meds.forEach((m,j)=>m.bestand=String(s.stock[j]));pl.patient.name+=" (Beispiel)";
      let q=S.persons.find(x=>x.name===pl.patient.name);if(!q){q=!P().meds.length&&/^Person \d+$/.test(P().name)&&i===0?P():newPerson();if(!S.persons.includes(q))S.persons.push(q)}
      q.name=pl.patient.name;q.meds=pl.meds;q.patient=pl.patient;q.order.docId=findOrCreateDoc({name:pl.patient.praxis}).id;if(i===0)S.current=q.id});save();render();break;
    case "note-x":importNote=null;renderMeds();break;
    case "med-open":medDel=false;openSheet("med",id);break;
    case "med-new":{const m=newMed({noName:true,name:"Neues Medikament",m:1});p.meds.push(m);save();medDel=false;openSheet("med",m.id);setTimeout(()=>$("md_name")?.focus(),50);break}
    case "med-del":medDel=true;shMed(sheetArg);break;
    case "med-del-no":medDel=false;shMed(sheetArg);break;
    case "med-del-yes":{const m=p.meds.find(x=>x.id===sheetArg);p.meds=p.meds.filter(x=>x.id!==sheetArg);delete pk[sheetArg];save();medDel=false;closeSheet();toast(`${m?.name||"Medikament"} entfernt.`);break}
    case "stock":openSheet("stock");break;
    case "plan":planMsg=null;planDoc=null;openSheet("plan");break;
    case "draft":{const v=$(b.dataset.src)?.value||"",url=mailto(b.dataset.to,v),note=$(b.dataset.src+"_dn");note.hidden=true;
      let left=false;const mark=()=>{left=true};document.addEventListener("visibilitychange",mark,{once:true});window.addEventListener("blur",mark,{once:true});
      const tryA=t=>{const a=document.createElement("a");a.href=url;if(t)a.target=t;a.rel="noopener";document.body.appendChild(a);a.click();a.remove()};
      try{tryA("_top")}catch(err){}
      setTimeout(()=>{if(left)return;try{tryA("_blank")}catch(err){}
        setTimeout(()=>{if(left)return;try{window.open(url,"_blank")}catch(err){}
          setTimeout(()=>{if(!left)note.hidden=false},1200)},900)},900);
      break}
    case "cp":{const v=$(b.dataset.src)?.value||"",x=splitMail(v);copyText(b.dataset.part==="to"?b.dataset.to:b.dataset.part==="subj"?x.subj:x.body,b);break}
    case "pk-book":bookPicked();if(sheetKind==="stock")closeSheet();else render();break;
    case "pk-drop":{const m=p.meds.find(x=>x.id===id);m.pending=null;delete pk[id];save();toast(`Anforderung für ${m.name} verworfen.`);render();break}
    case "rx-low":rxStep=1;p.meds.forEach(m=>{if(m.order&&!isLow(m))m.order=false});rxPreselect();rxMsg=null;go("rx");break;
    case "rx-pick":rxStep=3;go("rx");break;
    case "rx-step":rxStep=+b.dataset.step;if(rxStep===2)rxMsg=rxMsg??null;renderRx();window.scrollTo(0,0);break;
    case "rx-qty":{const m=p.meds.find(x=>x.id===id);m.menge=Math.max(1,Math.min(9,(m.menge||1)+(+b.dataset.d)));rxMsg=null;save();renderRx();break}
    case "rx-regen":rxMsg=rxMailText();renderRx();break;
    case "rx-sent":{const sel=p.meds.filter(m=>m.order&&!m.pending);sel.forEach(m=>{m.order=false;m.lastOrder=today();m.pending={menge:m.menge,packung:m.packung,date:today()}});
      rxMsg=null;rxNote="";save();rxStep=3;render();window.scrollTo(0,0);toast(`${sel.length} Medikament${sel.length>1?"e":""} als angefordert gemerkt. Nach dem Abholen hier abhaken.`,null,null,6000);break}
    case "doc-edit":openSheet("doc",id);break;
    case "doc-done":closeSheet();if(view==="rx"){rxMsg=null}break;
    case "doc-add":{const d={id:uid(),name:"",email:"",phone:"",addr:""};S.docs.push(d);save();openMore.add("docs");renderMore();$("df_name_"+d.id)?.focus();break}
    case "d-del":delDocId=id;renderMore();break;
    case "d-del-no":delDocId=null;renderMore();break;
    case "d-del-yes":S.docs=S.docs.filter(d=>d.id!==id);S.persons.forEach(q=>{if(q.order?.docId===id)delete q.order.docId});delDocId=null;save();render();break;
    case "p-del":delId=id;renderMore();break;
    case "p-del-no":delId=null;renderMore();break;
    case "p-del-yes":delPerson();break;
    case "tpl-reset":delete S[b.dataset.key];save();renderMore();toast("Standardvorlage wiederhergestellt.");break;
    case "bk-make":{const pw=$("bkPass").value;if(pw.length<6){toast("Bitte ein Passwort mit mindestens 6 Zeichen eingeben.");$("bkPass").focus();break}
      try{const t=await makeBackup(pw),o=$("bkOut");o.hidden=false;o.value=t;try{await navigator.clipboard.writeText(t);toast("Sicherung kopiert. An dich selbst schicken, Passwort getrennt merken.",null,null,6000)}catch(err){o.focus();o.select();toast("Text ist markiert. Jetzt kopieren.")}}catch(err){toast(err.message)}break}
    case "rs-check":{try{const o=await readBackup($("rsText").value,$("rsPass").value);pendingRestore=o;const m=o.S.persons.reduce((x,q)=>x+(q.meds?.length||0),0);
      $("rsConfirm").innerHTML=`<div class="confirm"><b>Sicherung vom ${new Date(o.created).toLocaleString("de-DE")}</b><span class="small">${o.S.persons.length} Person(en), ${m} Medikamente, ${(o.S.docs||[]).length} Ärzte. Die Daten auf diesem Gerät werden ersetzt.</span><div class="btns"><button class="btn danger" data-act="rs-yes">Ja, ersetzen</button><button class="btn ghost" data-act="rs-no">Abbrechen</button></div></div>`}
      catch(err){$("rsConfirm").innerHTML=`<p class="note err">${esc(err.message)}</p>`}break}
    case "rs-no":pendingRestore=null;$("rsConfirm").innerHTML="";break;
    case "rs-yes":if(!pendingRestore)break;purgeTransient();S=pendingRestore.S;pendingRestore=null;S.persons=S.persons||[];S.persons.forEach(p=>{p.order=p.order||{}});migrate();
      if(!S.persons.length)S.persons.push(newPerson("Person 1"));if(!S.persons.find(q=>q.id===S.current))S.current=S.persons[0].id;save();go("home");toast("Sicherung eingelesen.");break;
  }
});
let pendingRestore=null;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

/* ===== Start ===== */
go(P().meds.length?"home":"home");

})();
</script>
